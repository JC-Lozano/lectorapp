<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LectorApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">LectorApp</span>
        </div>
    </nav>
    <main class="container mt-4">
        <h2>Agregar Libro</h2>
        <!-- Formulario para agregar un libro -->
        <form action="">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo">
            </div>
            <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="autor">
            </div>
            <div class="mb-3">
                <label for="genero" class="form-label">Género</label>
                <input type="text" class="form-control" id="genero">
            </div>
            <div class="mb-3">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" id="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="en_progreso">Leyendo</option>
                    <option value="completado">Terminado</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="calificacion" class="form-label">Calificación</label>
                <input type="number" class="form-control" id="calificacion" min="1" max="5">
            </div>
            <button type="submit" class="btn btn-primary">Agregar Libro</button>
        </form>
        <!-- Lista de libros -->
        <h2 class="mt-5">Lista de Libros</h2>
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Género</th>
                <th>Estado</th>
                <th>Calificación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-libros">
        </tbody>
        </table>
    </main>
</body>
</html>

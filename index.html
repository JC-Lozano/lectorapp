<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LectorApp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <div class="layout">
      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <i class="bi bi-book-half"></i> LectorApp
        </div>
        <ul class="sidebar-menu">
          <li><i class="bi bi-house"></i> Inicio</li>
          <li><i class="bi bi-journal-bookmark"></i> Mis Libros</li>
          <li><i class="bi bi-plus-circle"></i> Agregar Libro</li>
        </ul>
        <button type="button" class="btn-logout-sidebar" id="btn-logout">
          <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </button>
      </aside>

      <!-- ===== CONTENIDO PRINCIPAL ===== -->
      <main class="main-content">
        <!-- ===== TABS: Navegación entre pestañas ===== -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="libros">Mis Libros</button>
          <button class="tab-btn" data-tab="agregar">Agregar Libro</button>
        </div>

        <!-- ===== TAB CONTENT: Mis Libros ===== -->
        <div class="tab-content active" id="tab-libros">
          <h2>Mis Libros</h2>
          <!-- Aquí van a ir las tarjetas de libros -->
        </div>

        <!-- ===== TAB CONTENT: Agregar Libro ===== -->
        <div class="tab-content" id="tab-agregar">
          <h2>Agregar Libro</h2>
          <!-- Aquí va el formulario -->
        </div>
      </main>
    </div>
  </body>
</html>
